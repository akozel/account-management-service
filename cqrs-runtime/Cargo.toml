[package]
name = "cqrs-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[features]
default = ["postgres", "worker"]
postgres = ["dep:postgres-es", "dep:sqlx"]
worker = ["dep:tracing", "tokio/rt", "tokio/sync"]

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
cqrs-es = "0.5.0"
postgres-es = { version = "0.5.0", optional = true }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["json", "chrono", "uuid", "postgres", "runtime-tokio-rustls"], optional = true }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["time", "macros"] }
tracing = { version = "0.1.44", optional = true }
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[dev-dependencies]
async-channel = "2.5.0"
flume = "=0.12.0"
kanal = "=0.1.1"
testcontainers = "0.28.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "test-util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
