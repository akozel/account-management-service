[package]
name = "cqrs-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[features]
default = ["postgres", "worker"]
host = ["worker", "tokio/signal"]
logging = ["dep:tracing-subscriber"]
postgres = ["dep:postgres-es", "dep:sqlx"]
worker = ["dep:async-channel", "dep:tokio-util", "tokio/rt", "tokio/sync"]

[dependencies]
async-channel = { version = "2.5.0", optional = true }
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
cqrs-es = "0.5.0"
postgres-es = { version = "0.5.0", optional = true }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["json", "chrono", "uuid", "postgres", "runtime-tokio-rustls"], optional = true }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["time", "macros"] }
tokio-util = { version = "0.7.19", default-features = false, optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", optional = true }
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[dev-dependencies]
log = "0.4.34"
testcontainers = "0.28.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "test-util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
