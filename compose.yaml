services:
  postgres:
    image: docker.io/library/postgres:18.6-alpine
    environment:
      POSTGRES_DB: account_management
      POSTGRES_USER: account_management
      POSTGRES_PASSWORD: account_management
    ports:
      - "5432:5432"
    volumes:
      - account_management_postgres_data:/var/lib/postgresql
      - ./deploy/postgres/001-event-store.sql:/docker-entrypoint-initdb.d/001-event-store.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_management -d account_management"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  account_management_postgres_data:
