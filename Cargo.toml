[package]
name = "account-management-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
cqrs-es = "0.5.0"
dotenvy = "0.15.7"
email_address = "0.2.9"
hex = "0.4.3"
postgres-es = "0.5.0"
percent-encoding = "2.3.2"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["json", "chrono", "uuid", "postgres", "runtime-tokio-rustls"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[dev-dependencies]
testcontainers = "0.28.0"
tokio = { version = "1.53.1", features = ["sync", "time", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
