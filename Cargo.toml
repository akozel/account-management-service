[package]
name = "account-management-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
cqrs-es = "0.5.0"
email_address = "0.2.9"
postgres-es = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
